name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # 允许在 GitHub 页面手动触发

# 同一分支上新的 push 会取消还在跑的旧任务,省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------
  # 1. 代码质量检查
  # ------------------------------------------------------------------
  lint:
    name: 代码检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev

      # continue-on-error: 第一次跑大概率一堆格式问题,
      # 先让它报出来但不阻断流程。等你清理完再删掉这两行。
      - name: ruff 格式检查
        continue-on-error: true
        run: uv run ruff format --check .

      - name: ruff 静态检查
        continue-on-error: true
        run: uv run ruff check .

  # ------------------------------------------------------------------
  # 2. 单元测试
  # ------------------------------------------------------------------
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen 强制使用 uv.lock,锁文件和 pyproject 不一致会直接失败。
      # 这正是当初部署踩的那个坑,在这里提前暴露。
      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev
      - name: 准备配置文件
        run: cp config.example.yaml config.yaml
      - name: 跑测试(跳过需要外网的用例)
        env:
          LLM_API_KEY: dummy-key-for-ci
          BINANCE_API_KEY: dummy
          BINANCE_API_SECRET: dummy
        run: |
          uv run pytest tests/ \
            -m "not network" \
            -v \
            --tb=short \
            --durations=10

  # ------------------------------------------------------------------
  # 3. Docker 构建验证
  # ------------------------------------------------------------------
  docker:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [test]           # 测试没过就不用浪费时间构建了
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建不推送。目的是验证 Dockerfile 和 uv.lock 在干净环境下能建起来,
      # 而不是等到部署时才发现构建失败。
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tradebot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证 compose 配置合法
        run: docker compose config --quiet

      - name: 冒烟测试 — 容器能否正常启动
        env:
          LLM_API_KEY: dummy-key-for-ci
        run: |
          uv run python -m pytest tests/ \
            -v \
            --tb=short \
            --durations=10