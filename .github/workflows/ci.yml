name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------
  # 1. 代码质量检查
  # ------------------------------------------------------------------
  lint:
    name: 代码检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev

      # 代码库已完成一次性 ruff 清理,这两步是硬性门槛:
      # 格式或静态检查不通过直接阻断,不允许带着 lint 问题合并。
      - name: ruff 格式检查
        run: uv run ruff format --check .

      - name: ruff 静态检查
        run: uv run ruff check .

  # ------------------------------------------------------------------
  # 2. 单元测试
  # ------------------------------------------------------------------
  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # --frozen 强制使用 uv.lock。锁文件与 pyproject 不一致会直接失败,
      # 正是当初部署踩过的坑,在这里提前暴露。
      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev

      # config.yaml 被 gitignore(含密钥),CI 上不存在,
      # 用示例文件生成一份供测试使用。
      - name: 准备配置文件
        run: cp config.example.yaml config.yaml

      - name: 跑测试
        env:
          LLM_API_KEY: dummy-key-for-ci
          BINANCE_API_KEY: dummy
          BINANCE_API_SECRET: dummy
        run: |
          uv run python -m pytest tests/ \
            -v \
            --tb=short \
            --durations=10

  # ------------------------------------------------------------------
  # 3. Docker 构建验证(双容器)
  # ------------------------------------------------------------------
  docker:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [test]           # 测试没过就不浪费时间构建
    steps:
      - uses: actions/checkout@v4

      # compose 里 config.yaml 是 bind mount 源,校验配置时必须存在
      - name: 准备配置文件
        run: cp config.example.yaml config.yaml

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # 只构建不推送,验证 Dockerfile 与 uv.lock 在干净环境下能建起来。
      # 两个镜像用不同 cache scope,否则缓存互相覆盖。
      - name: 构建采集容器
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: false
          load: true
          tags: tradebot-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      - name: 构建 API 容器
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: tradebot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 验证 compose 配置合法
        env:
          LLM_API_KEY: dummy-key-for-ci
        run: docker compose config --quiet

      - name: 冒烟测试 — 两个镜像能否正常启动
        run: |
          docker run --rm tradebot-collector:ci \
            python -c "import sys; print(f'collector OK, Python {sys.version}')"
          docker run --rm tradebot-api:ci \
            python -c "import sys; print(f'api OK, Python {sys.version}')"