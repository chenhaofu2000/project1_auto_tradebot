name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: 代码检查 (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev

      - name: ruff 格式检查
        continue-on-error: true
        run: uv run ruff format --check .

      - name: ruff 静态检查
        continue-on-error: true
        run: uv run ruff check .

  test:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 同步依赖
        run: uv sync --frozen --all-extras --dev

      - name: 准备配置文件
        run: cp config.example.yaml config.yaml

      - name: 跑测试
        env:
          LLM_API_KEY: dummy-key-for-ci
          BINANCE_API_KEY: dummy
          BINANCE_API_SECRET: dummy
        run: |
          uv run python -m pytest tests/ \
            -v \
            --tb=short \
            --durations=10

  docker:
    name: Docker 构建验证
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建采集容器
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.collector
          push: false
          load: true
          tags: tradebot-collector:ci
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector

      - name: 构建 API 容器
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          load: true
          tags: tradebot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 准备配置文件
        run: cp config.example.yaml config.yaml

      - name: 验证 compose 配置合法
        env:
          LLM_API_KEY: dummy-key-for-ci
        run: docker compose config --quiet

      - name: 冒烟测试
        run: |
          docker run --rm tradebot-collector:ci \
            python -c "import sys; print(f'collector OK, Python {sys.version}')"
          docker run --rm tradebot-api:ci \
            python -c "import sys; print(f'api OK, Python {sys.version}')"